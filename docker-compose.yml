services:
  portfolio:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_WEB3FORMS_KEY: ${VITE_WEB3FORMS_KEY}
    image: personal-portfolio:latest
    container_name: personal-portfolio-container
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - VITE_WEB3FORMS_KEY=${VITE_WEB3FORMS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
