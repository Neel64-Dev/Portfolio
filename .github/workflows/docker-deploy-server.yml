name: Build and Deploy Docker Image to Server

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to remote server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Wait for image to be available
        run: echo "Image built and pushed"

      - name: Deploy to server (SSH)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            echo "Pulling image..."
            docker pull ${{ secrets.DOCKER_IMAGE }}:latest

            echo "Stopping existing container (if any)..."
            docker stop personal-portfolio-container || true
            docker rm personal-portfolio-container || true

            echo "Running new container..."
            docker run -d --name personal-portfolio-container -p 80:80 --restart unless-stopped ${{ secrets.DOCKER_IMAGE }}:latest

            echo "Deployment finished."
